name: Build ASTER Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-Browser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.5.0 app/build/outputs/apk/debug/app-debug.apk \\
              --title "ASTER Browser 0.5.0" \\
              --notes "ASTER Browser Android debug build. Install the APK on an Android device; this is a test build, not a Play Store release."
          fi
