name: Build and Release ASTER Browser

on:
  workflow_dispatch:
  push:
    branches: [ main, 'aster-*' ]
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: aster-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP "versionName '\\K[^']+" app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Decide whether this is a major release
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [[ "$COMMIT_MESSAGE" == *"[release]"* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare persistent release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ASTER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ASTER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASTER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aster-release.jks"
            echo "ASTER_STORE_FILE=$RUNNER_TEMP/aster-release.jks" >> "$GITHUB_ENV"
            echo "ASTER_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ASTER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ASTER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Persistent signing is not configured. Building a debug APK for testing only; no install-over update will be published."
          fi
      - name: Set up Android SDK
        id: sdk
        uses: android-actions/setup-android@v3
      - name: Build signed release APK
        id: signed_build
        if: steps.signing.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee -a build.log
      - name: Build debug APK for testing
        if: steps.signing.outputs.ready != 'true' || steps.signed_build.outcome == 'failure'
        run: |
          set -o pipefail
          if [ "${{ steps.signed_build.outcome }}" = "failure" ]; then
            echo "::warning::The signed release build failed; building a debug-signed APK instead."
          fi
          gradle :app:assembleDebug --stacktrace 2>&1 | tee -a build.log
      - name: Report build errors
        if: always() && (failure() || steps.signed_build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          touch build.log
          {
            echo "===== step outcomes ====="
            echo "$STEPS_JSON"
            echo "===== environment ====="
            echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            java -version 2>&1 || true
            gradle --version 2>&1 | head -20 || true
            ls -la app/build/outputs/apk/*/ 2>&1 || true
          } >> build.log
          { grep -E "error:|e: |What went wrong|FAILED|Exception" build.log || true; } | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          mkdir -p "$RUNNER_TEMP/ci-logs" && cp build.log "$RUNNER_TEMP/ci-logs/build.log"
          cd "$RUNNER_TEMP/ci-logs"
          git init -q
          git add build.log
          git -c user.name="aster-ci" -c user.email="aster-ci@users.noreply.github.com" commit -q -m "CI build log for run $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs || true
      - name: Prepare stable APK filename
        run: |
          if [ "${{ steps.signed_build.outcome }}" = "success" ]; then
            cp app/build/outputs/apk/release/app-release.apk ASTER-Browser.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ASTER-Browser.apk
          fi
      - name: Upload signed APK artifact
        if: steps.signed_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-Browser-v${{ steps.version.outputs.version }}-signed
          path: ASTER-Browser.apk
          retention-days: 30
      - name: Upload debug test APK artifact
        if: steps.signed_build.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-Browser-v${{ steps.version.outputs.version }}-debug-test-only
          path: ASTER-Browser.apk
          retention-days: 30
      - name: Publish signed GitHub Release
        if: steps.release.outputs.publish == 'true' && steps.signed_build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ASTER Browser ${{ steps.version.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ASTER-Browser.apk
      - name: Publish source release with directly downloadable debug APK
        if: steps.release.outputs.publish == 'true' && steps.signed_build.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ASTER Browser ${{ steps.version.outputs.release_tag }}
          generate_release_notes: true
          body: |
            This major version is published with its source code, release notes, and a directly downloadable Android APK named ASTER-Browser.apk.

            IMPORTANT: This APK is signed with a temporary debug key. It is for testing and may not install over an existing ASTER Browser build. Do not uninstall an existing installation unless you have backed up any data you need.
          files: |
            ASTER-Browser.apk
